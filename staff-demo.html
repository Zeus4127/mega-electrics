<div class="demo">Design preview of the Mega staff back end. Every company, person, number and dollar amount here is made up. Nothing is saved or sent. <a href="start.html">Back to the tour</a></div>
<div class="app">
<aside id="side" aria-label="Sections"><div class="brand"><img src="brand/logo-mark.png" alt=""><div>ELECTRICS<small>OPERATIONS CONSOLE</small></div></div><nav id="nav"></nav>
<div class="legend"><i class="b"></i>Built and tested, ready to switch on<br><i></i>Design preview, built after sign-off</div></aside>
<div><header class="top"><button class="ib menu" id="menu" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<label class="search"><input id="q" type="search" placeholder="Search jobs, clients, people, enquiries" aria-label="Search"></label>
<select id="region" aria-label="Region"><option value="all">All regions</option><option value="QLD">QLD</option><option value="NSW">NSW</option><option value="VIC">VIC</option><option value="INT">Overseas</option></select>
<button class="ib" id="bell" aria-label="Alerts"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20a2 2 0 0 0 4 0"/></svg><b id="bellN"></b></button>
<button class="ib" id="theme" aria-label="Light or dark"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
<select id="role" aria-label="View as role"></select></header>
<main id="view"></main></div></div>
<div class="gate" id="gate"></div><div class="scrim" id="scrim"></div><section class="drawer" id="drawer" aria-label="Details"></section><div class="guide" id="guide" role="region" aria-label="Walk-through"></div><div class="toast" id="toast" role="status"></div>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); }, now = Date.now(), DAY = 864e5, HR = 36e5;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function money(n) { return n >= 1e6 ? "A$" + (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "m" : "A$" + Math.round(n / 1e3) + "k"; }
  function day(off) { return new Date(now + off * DAY).toLocaleDateString("en-AU", { day: "numeric", month: "short" }); }
  function ago(h) { return h < 1 ? Math.round(h * 60) + " min ago" : h < 24 ? Math.round(h) + " h ago" : Math.round(h / 24) + " d ago"; }
  function pill(t, tone) { return '<span class="pill ' + (tone || "") + '">' + esc(t) + "</span>"; }
  function exp(d) { return d < 0 ? pill("Expired " + (-d) + " d", "bad") : d <= 30 ? pill(d + " d left", "warn") : pill(day(d), "ok"); }

  function closeAll() { $("#drawer").classList.remove("open"); $("#scrim").classList.remove("open"); $("#side").classList.remove("open"); }
