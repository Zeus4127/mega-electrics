.err{color:#b42318}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}h2{margin:0 0 10px;color:var(--navy)}

  async function options() {
    var rows = await api("options");
    main.innerHTML = '<h2>Options</h2><p class="meta">What is switched on. Each option is turned on by an administrator adding its setting; nothing here changes by itself.</p><div class="card"><table>' +
      rows.map(function (r) { return "<tr><td>" + esc(r.label) + "</td><td><b style=\"color:" + (r.on ? "#1d7a3c" : "#8a6d00") + "\">" + (r.on ? "On" : "Off") + '</b></td><td class="meta">' + (r.on ? "" : "Needs: " + esc(r.needs)) + "</td></tr>"; }).join("") + "</table></div>";
  }
  async function show() {
    tabs();
    try {
      if (S.tab === "inbox") await inbox(false); else if (S.tab === "held") await inbox(true); else if (S.tab === "log") await log();
      else if (S.tab === "stats") await stats(); else if (S.tab === "options") await options(); else await edit(S.tab);
    } catch (er) { main.innerHTML = '<p class="card err">' + esc(er.message) + "</p>"; }
  }
  main.addEventListener("click", function (e) {
    var it = e.target.closest(".item"); if (it) { S.sel = Number(it.dataset.id); show(); return; }
    var f = e.target.dataset.f; if (f) { S.filter = f; show(); }
  });
  api("me").then(function (m) { S.me = m; document.getElementById("me").textContent = (m.name || m.email) + " · " + m.role + (m.state ? " · " + m.state : ""); S.filter = "must"; show(); },
    function (er) { document.getElementById("me").textContent = ""; main.innerHTML = '<p class="card err">' + esc(er.message) + "</p>"; });
})();
</script></body></html>
